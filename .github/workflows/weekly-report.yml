name: Weekly AI Report

on:
  schedule:
    # Unchanged: 08:43 Asia/Shanghai every Monday, Wednesday and Friday.
    - cron: "43 0 * * 1,3,5"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number (optional; defaults to the ISO week number)"
        required: false
      send:
        description: "Send the email after generating (true/false)"
        required: false
        default: "true"
      initialize_history:
        description: "First rollout only: initialize empty history (use send=false)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-ai-report
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Restore delivery history
        uses: actions/github-script@v7
        env:
          INITIALIZE_HISTORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.initialize_history == 'true' && github.event.inputs.send == 'false' }}
        with:
          script: |
            await require('./.github/scripts/restore-history.cjs')({github, context, core});

      - name: Determine issue number
        id: meta
        env:
          REQUESTED_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          ISSUE="$REQUESTED_ISSUE"
          if [ -z "$ISSUE" ]; then ISSUE="$(date -u +%V)"; fi
          if ! [[ "$ISSUE" =~ ^[a-zA-Z0-9_-]{1,40}$ ]]; then exit 1; fi
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Generate report
        run: npm run report -- --issue "${{ steps.meta.outputs.issue }}"

      - name: Read current report and quality status
        id: report
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const result=JSON.parse(readFileSync('reports/latest-report.json','utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT,`file=${result.file}\npassed=${result.quality.passed}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Report quality: ${result.quality.passed?'PASS':'BLOCKED'}\n\n${[...result.quality.errors,...result.quality.warnings].map(x=>`- ${x}`).join('\n')}\n`);
          JS

      - name: Upload report and evidence artifact
        if: ${{ always() && steps.report.outputs.file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-report-${{ steps.meta.outputs.issue }}-${{ github.run_id }}
          path: |
            ${{ steps.report.outputs.file }}
            ${{ steps.report.outputs.file }}.manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce quality gate
        if: ${{ steps.report.outputs.passed != 'true' }}
        run: |
          echo "::error::Report quality gate failed. No email was sent; inspect report artifact and job summary."
          exit 1

      - name: Send email
        if: ${{ github.event_name == 'schedule' || github.event.inputs.send != 'false' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '465' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'true' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_SUBJECT: ${{ secrets.REPORT_SUBJECT }}
        run: npm run send -- "${{ steps.report.outputs.file }}"

      - name: Preserve confirmed or pending delivery history
        if: ${{ always() && hashFiles('data/delivery-history.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-report-delivery-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/delivery-history.json
          if-no-files-found: error
          retention-days: 90
