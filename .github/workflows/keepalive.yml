name: Keep Scheduled Workflows Active

# Public repositories lose scheduled workflows after 60 days of inactivity.
# Check weekly and refresh repository activity well before that limit.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keepalive.yml"

permissions:
  contents: read

concurrency:
  group: scheduled-workflow-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.repository == 'vitinchen-prog/web-info-fetcher' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh repository activity when needed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Fetch again so a queued run uses the latest default-branch commit.
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" FETCH_HEAD
          last_commit=$(git log -1 --format=%ct)
          now=$(date -u +%s)
          age_days=$(( (now - last_commit) / 86400 ))

          # The initial marker verifies push permission on the first run.
          if [ -f .github/keepalive ] && [ "$age_days" -lt 30 ]; then
            echo "Last commit was $age_days days ago; no maintenance commit needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p .github
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/keepalive
          git commit -m "chore: keep scheduled workflows active"
          # Never force-push: concurrent changes must not be overwritten.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          echo "Repository activity refreshed; previous commit age: $age_days days." >> "$GITHUB_STEP_SUMMARY"
